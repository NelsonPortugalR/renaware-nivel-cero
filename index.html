<!doctype html>
<html lang="es-PE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">

<title>Nivel Cero · Equipo Arequipa</title>

<style>
/* Claro a propósito, como el resto de la plataforma: los colores de estado
   llevan significado y Chrome los distorsiona si auto-oscurece la página. */
:root{
  color-scheme: light;
  --ink:#101C2E; --ink70:#3A4658; --ink40:#7C8794;
  --paper:#EDEFEA; --card:#FFF; --rule:#D4D8D0; --soft:#F4F5F1;
  --verde:#0F6E4F; --verdeS:#E2EFE8;
  --ambar:#A96A08; --ambarS:#F6EAD3;
  --alerta:#9B2C2C; --alertaS:#F5E0E0;
  --acero:#3E5C8A; --aceroS:#E3E9F2;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(40px + env(safe-area-inset-bottom))}
body.con-modal{overflow:hidden}
button{font-family:inherit;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding-left:16px;padding-right:16px}
.mono{font-family:var(--mono)}
.caps{text-transform:uppercase;letter-spacing:.13em;font-family:var(--mono)}
.tiny{font-size:9.5px}
.lbl{display:block;font:10px/1.2 var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--ink40);margin:0 0 6px}
.hint{font:12px/1.55 var(--mono);color:var(--ink40)}
.err{color:var(--alerta);font:13px/1.5 var(--mono);margin:10px 0 0}
.card{background:var(--card);border:1px solid var(--rule)}
.pad{padding:14px 16px}
.mt{margin-top:14px}

/* cabecera */
.top{background:var(--ink);color:#fff;position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top)}
.fila-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.top .fila-top{padding-top:12px;padding-bottom:6px}
.marca{display:flex;align-items:center;gap:10px}
.cero{flex:0 0 auto;width:34px;height:34px;border:3px solid currentColor;border-radius:50%}
.top .caps{color:#A9B2BE}
.h1{font-size:19px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.acciones-top{display:flex;align-items:center;gap:12px}
.icono{background:none;border:1px solid #3A4658;color:#fff;width:36px;height:36px;font-size:18px;line-height:1}
.tabs{display:flex;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 1 auto;min-width:0;background:none;border:0;border-bottom:3px solid transparent;color:#A9B2BE;
  padding:11px 4px 7px;font:10px/1.3 var(--mono);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;min-height:52px}
@media (max-width:480px){nav.tabs{padding-left:2px;padding-right:2px}}
.tab.on{color:#fff;border-bottom-color:#fff}
.cuenta{display:inline-block;min-width:18px;padding:1px 5px;background:var(--ink40);color:#fff;
  font:10px/14px var(--mono);border-radius:9px;text-align:center;letter-spacing:0;vertical-align:1px}
.tab .cuenta{background:#33415A;font-size:9.5px;line-height:13px;min-width:16px;vertical-align:0}
.tab.on .cuenta{background:var(--ambar)}
main.wrap{padding-top:16px}

/* elementos */
.lk{background:none;border:0;padding:0;font:12px/1.5 var(--mono);color:var(--acero);text-decoration:underline;text-underline-offset:2px}
.lk.claro{color:#C9D1DB}
.lk.peligro,.btn.peligro{color:var(--alerta)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--ink);background:var(--ink);color:#fff;
  padding:12px 16px;font:12px/1.1 var(--mono);text-transform:uppercase;letter-spacing:.08em;min-height:44px;text-decoration:none}
.btn.sec{background:#fff;color:var(--ink);border-color:var(--rule)}
.btn.ok{background:var(--verde);border-color:var(--verde);color:#fff}
.btn.sm{padding:8px 11px;min-height:36px;font-size:11px}
.btn.grande{min-height:58px;font:600 16px/1.25 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-transform:none;letter-spacing:0}
.nw{white-space:nowrap}
.btn.full{width:100%;margin-top:10px}
.btn[disabled]{opacity:.4;cursor:default}
.in{width:100%;padding:11px 12px;border:1px solid var(--rule);background:#fff;color:var(--ink);font-size:16px;border-radius:0;-webkit-appearance:none;appearance:none}
.in:focus{outline:2px solid var(--acero);outline-offset:-1px;border-color:var(--acero)}
textarea.in{resize:vertical;min-height:64px}
input[type=date].in,input[type=time].in{min-height:46px}
.busca{margin:14px 0 10px}
.regla{font:12.5px/1.5 var(--mono);color:var(--ink70);margin:0 0 14px;padding-left:10px;border-left:3px solid var(--acero)}
.aviso{background:var(--ambarS);border-left:3px solid var(--ambar);padding:10px 12px;font:12.5px/1.5 var(--mono);color:#5E3C04;margin:12px 0}
.aviso.chico{margin:8px 0 0;font-size:12px}
.sec-t{font:11px/1.2 var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--ink70);margin:22px 0 8px;display:flex;align-items:center;gap:8px}
.sec-t.chico{margin-top:18px}
.tag{display:inline-block;font:9.5px/15px var(--mono);text-transform:uppercase;letter-spacing:.08em;padding:0 5px;background:var(--aceroS);color:var(--acero);vertical-align:2px;font-weight:400}
.tag.gris{background:var(--soft);color:var(--ink40)}
.tag.ok{background:var(--verdeS);color:var(--verde)}
.nv{display:inline-grid;place-items:center;min-width:24px;height:22px;padding:0 4px;font:700 10px/1 var(--mono);border:1.5px solid var(--acero);color:var(--acero);background:#fff}
.der.nvs{gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:78px}
.nv2{background:var(--aceroS)}
.nv3{background:var(--acero);color:#fff}
.nv4{border-color:var(--ambar);color:var(--ambar)}
.niveles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:12px 0}
.tnv{background:#fff;border:1px solid var(--rule);padding:10px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:64px}
.tnv b{font:700 21px/1 var(--mono)}
.tnv span{font:9px/1.2 var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--ink40);text-align:center}
.tnv.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tnv.on span{color:#C9D1DB}
.cruce{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cruce.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
.cruce>div,.cz{display:flex;flex-direction:column;gap:3px}
.cz{background:none;border:1px solid transparent;padding:6px;text-align:left;color:inherit;font:inherit;cursor:pointer}
.cz.on{border-color:var(--ink);background:var(--soft)}
.cruce b{font:700 22px/1 var(--mono)}
.cruce span{font:11px/1.3 var(--mono);color:var(--ink40)}
.cruce .ok b{color:var(--verde)}
.cruce .mal b{color:var(--ambar)}
.clases-p li{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.clases-p li>span{min-width:0}
.clases-p li>button{flex:0 0 auto;white-space:nowrap}
.caja-edit{border:1px solid var(--rule);background:var(--soft);padding:10px;margin-top:10px}
/* mensajes de seguimiento */
.btn svg{width:16px;height:16px;flex:0 0 auto}
.fila.msj{align-items:flex-start}
.prev{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:13px;line-height:1.45;color:var(--ink70);margin-top:3px}
.der.col{flex-direction:column;align-items:flex-end;gap:10px}
.wa.pend{position:relative}
.wa.pend::after{content:"";position:absolute;top:4px;right:4px;width:9px;height:9px;border-radius:50%;background:var(--ambar);border:2px solid #fff}
.msj-sec{border-top:1px solid var(--rule);padding-top:14px;margin:0 0 18px}
.msj-cab{display:flex;justify-content:space-between;align-items:center;gap:10px}
.msj-caja{border:1px solid var(--rule);background:var(--soft);padding:10px 12px;margin-top:10px}
.msj-texto{white-space:pre-wrap;font-size:14px;line-height:1.5;margin:4px 0 0;color:var(--ink);overflow-wrap:anywhere}
.hist{list-style:none;padding:0;margin:10px 0 0;font:12px/1.8 var(--mono);color:var(--ink70)}
.hist.card{padding:8px 14px}
.hist li{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.hist li>span{min-width:0}
.hist li>button{flex:0 0 auto}
.chips.chico .chip{min-height:32px;padding:7px 10px;font-size:10.5px}
.chip.mk{text-transform:none;letter-spacing:.02em}
.regla.mt{margin-top:14px}
.paso{padding:11px 0;border-top:1px solid var(--rule)}
.paso-cab{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.paso-cab .lk{margin-left:auto}
.paso.abierto{background:var(--soft);margin:0 -16px;padding:12px 16px}
.marcas code{font:11px var(--mono);background:var(--soft);padding:1px 4px}
textarea#mTexto{min-height:150px;font-size:15px;line-height:1.45}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--rule);background:#fff;padding:9px 12px;font:11px/1 var(--mono);text-transform:uppercase;letter-spacing:.07em;color:var(--ink70);min-height:38px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip span{opacity:.7;margin-left:3px}
.chk{display:flex;align-items:center;gap:10px;font:13px/1.4 var(--mono);color:var(--ink70);margin:14px 0 4px}
.chk input{width:20px;height:20px;flex:0 0 auto}

/* filas */
.fila{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1px solid var(--rule);
  margin-top:-1px;padding:12px 14px;min-height:62px;font-size:inherit}
.fila[role=button],.fila[data-a]{cursor:pointer}
.cuerpo{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.cuerpo[role=button]{cursor:pointer}
.nom{font-size:15.5px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.sub{font:12px/1.4 var(--mono);color:var(--ink40)}
.sub.urge{color:var(--alerta)}
.sub.ok{color:var(--verde)}
.sub.mal{color:var(--ambar)}
.sub.chico{font-size:11px}
.der{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.pts{display:inline-flex;gap:3px;flex:0 0 auto}
.pts i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ink40);display:block}
.pts i.on{background:var(--acero);border-color:var(--acero)}
.wa{display:grid;place-items:center;width:42px;height:42px;border:1px solid var(--rule);color:var(--verde);background:#fff}
.wa svg{width:20px;height:20px}
.num{display:flex;flex-direction:column;align-items:flex-end;font:700 21px/1 var(--mono)}
.num small{font:10px/1.5 var(--mono);color:var(--ink40);text-transform:uppercase;letter-spacing:.07em;font-weight:400}

/* asistencia */
.asis .caja{flex:0 0 30px;height:30px;border:2px solid var(--ink40);background:#fff;display:grid;place-items:center}
.asis.on{background:var(--verdeS);border-color:#B9D6C7;position:relative;z-index:1}
.asis.on .caja{background:var(--verde);border-color:var(--verde)}
.asis.on .caja::after{content:"";width:8px;height:14px;border:solid #fff;border-width:0 3px 3px 0;transform:translateY(-2px) rotate(45deg)}
.asis[disabled]{opacity:.55;cursor:default}
.cab-clase .h2{font-size:18px;font-weight:700;margin-top:2px;line-height:1.25}
.cab-clase .sub{margin-top:3px}
.contador{display:flex;flex-direction:column;align-items:center;min-width:80px}
.contador b{font:700 34px/1 var(--mono);color:var(--verde)}
.volver{display:inline-block;margin:0 0 10px}

/* números */
.bloque{margin-top:16px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kpi{padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.kpi b{font:700 28px/1 var(--mono)}
.barra{margin:12px 0}
.barra-t{display:flex;justify-content:space-between;gap:10px;font:13px/1.3 var(--mono);color:var(--ink70);margin-bottom:5px}
.barra-t small{color:var(--ink40);font-weight:400}
.barra-f{height:10px;background:var(--soft);border:1px solid var(--rule)}
.barra-f i{display:block;height:100%;background:var(--acero)}
.comp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:6px 0 8px}
.comp>div{border:1px solid var(--rule);padding:12px;display:flex;flex-direction:column;gap:4px}
.comp b{font:700 26px/1 var(--mono)}
.comp>div:first-child b{color:var(--verde)}
.tabla-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{width:100%;border-collapse:collapse;font:12.5px/1.35 var(--mono)}
.t th{font-weight:400;color:var(--ink40);text-transform:uppercase;font-size:10px;letter-spacing:.05em;text-align:right;padding:6px 5px;border-bottom:1px solid var(--rule);white-space:nowrap}
.t td{text-align:right;padding:8px 5px;border-bottom:1px solid var(--soft);white-space:nowrap}
.t th:first-child,.t td:first-child{text-align:left;white-space:normal}

/* modal */
.ov{position:fixed;inset:0;background:rgba(16,28,46,.55);z-index:50;display:flex;justify-content:center;align-items:flex-end}
.modal{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-top:4px solid var(--ink);
  padding-bottom:env(safe-area-inset-bottom);-webkit-overflow-scrolling:touch}
@media(min-width:700px){.ov{align-items:flex-start;padding:40px 16px;overflow-y:auto}.modal{border:1px solid var(--ink);border-top-width:4px;max-height:none}}
.mhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 16px 10px;border-bottom:1px solid var(--rule);
  position:sticky;top:0;background:#fff;z-index:1}
.mhead .h2{font-size:18px;font-weight:700;line-height:1.25}
.x{background:none;border:0;font-size:30px;line-height:1;padding:0 4px;color:var(--ink70);min-width:40px;min-height:40px}
.mbody{padding:14px 16px 22px}
.estado{font:13px/1.45 var(--mono);padding:9px 11px;background:var(--soft);border-left:3px solid var(--ink40);margin-bottom:14px}
.estado.ok{background:var(--verdeS);border-color:var(--verde)}
.estado.urge{background:var(--alertaS);border-color:var(--alerta)}
.estado.mal{background:var(--ambarS);border-color:var(--ambar)}
dl.datos{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;margin:0 0 16px;font-size:14px}
dl.datos dt{font:10px/2 var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--ink40)}
dl.datos dd{margin:0;line-height:1.5;overflow-wrap:anywhere}
.clases-p{list-style:none;padding:0;margin:6px 0 0;font:12px/1.75 var(--mono);color:var(--ink70)}
.edit{margin-top:8px}
.fila-btn{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:8px}
.pie{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:18px;padding-top:14px;border-top:1px solid var(--rule)}

/* login y avisos */
.login{max-width:440px;padding-top:12vh}
.login .marca{margin-bottom:16px}
.login h1{margin:2px 0 0;font-size:26px;letter-spacing:-.01em}
.login .regla{margin-bottom:18px}
.centro{text-align:center;padding-top:80px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translate(-50%,140%);background:var(--ink);color:#fff;
  font:13px/1.4 var(--mono);padding:11px 16px;width:max-content;max-width:calc(100% - 32px);z-index:80;opacity:0;transition:transform .2s,opacity .2s;pointer-events:none}
.toast.on{transform:translate(-50%,0);opacity:1}
.toast.ok{background:var(--verde)}
.toast.mal{background:var(--alerta)}
@media(max-width:380px){.kpi b{font-size:24px}dl.datos{grid-template-columns:82px minmax(0,1fr)}.tab{padding-left:4px;padding-right:4px}}
</style>
</head>

<script>

/* ---------------------------------------------------------- utilidades */
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];

var MINUS = { de: 1, del: 1, la: 1, las: 1, los: 1, y: 1, e: 1, da: 1, van: 1, von: 1 };
function titulo(n) {
  return String(n || "").toLowerCase().replace(/\s+/g, " ").trim().split(" ").map(function (p, i) {
    if (i > 0 && MINUS[p]) return p;
    return p.charAt(0).toUpperCase() + p.slice(1);
  }).join(" ");
}
function pila(n) { return titulo(n).split(" ")[0] || ""; }
function plano(s) { return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase(); }
function partes(iso) { var p = String(iso).slice(0, 10).split("-"); return { y: +p[0], m: +p[1], d: +p[2] }; }

/* ---------------------------------------------------------- red */
function rpc(fn, args, sigue) {
  return fetch(SB_URL + "/rest/v1/rpc/" + fn, {
    method: "POST",
    headers: { "apikey": SB_KEY, "Authorization": "Bearer " + SB_KEY, "Content-Type": "application/json" },
    body: JSON.stringify(args || {}),
    keepalive: !!sigue
  }).then(function (r) {
    return r.text().then(function (t) {
      var j = null;
      try { j = t ? JSON.parse(t) : null; } catch (e) {}
      if (!r.ok) {
        var msg = (j && (j.message || j.hint || j.error)) || ("Error " + r.status);
        if (/Sesion invalida/i.test(msg) && fn !== "admin_login") cerrarSesion("Tu sesión se cerró. Vuelve a entrar.");
        throw new Error(msg);
      }
      return j;
    });
  });
}

    (p.asistencias || []).forEach(function (a) {

/* ganadores WV08 por código, y a qué inscrito corresponde cada ganador */
function indexarEY() {
  IDX.eyCod = {}; IDX.insPorCod = {};

  S.d.inscritos.forEach(function (p) { if (p.ey && p.ey.codigo) IDX.insPorCod[p.ey.codigo] = p.id; });

function parchar(p) {
  if (!p || !p.id || !S.d) return;
  var i = S.d.inscritos.findIndex(function (x) { return x.id === p.id; });
  if (i >= 0) S.d.inscritos[i] = p; else S.d.inscritos.unshift(p);
  IDX.ins[p.id] = p;
  Object.keys(IDX.presentes).forEach(function (c) { delete IDX.presentes[c][p.id]; });
  (p.asistencias || []).forEach(function (a) {
    if (!IDX.presentes[a.c]) IDX.presentes[a.c] = {};

  var i = S.d.clases.findIndex(function (x) { return x.id === k.id; });
  if (i >= 0) S.d.clases[i] = k; else S.d.clases.push(k);
  S.d.clases.sort(function (a, b) { return (b.fecha + b.hora).localeCompare(a.fecha + a.hora); });
  if (!IDX.presentes[k.id]) IDX.presentes[k.id] = {};

function cargar(silencioso) {
  if (!S.token) return Promise.resolve();
  if (!silencioso && !S.d) render();
  return rpc("n0_datos", { p_token: S.token }).then(function (d) {
    var primera = !S.d;
    S.d = d; S.errorCarga = null; indexar(); ponerEnviosPend();
    if (primera && !S.filtroElegido && porEscribir().length) S.filtro = "escribir";
    setTimeout(reintentarEnvios, 0);
    if (S.clase && !claseDe(S.clase)) S.clase = null;
    if (S.modal && S.modal.tipo === "persona" && !IDX.ins[S.modal.id]) S.modal = null;
  }).catch(function (e) {
    if (!S.token) return;
    if (!S.d) S.errorCarga = bonito(e.message); else aviso(bonito(e.message), "mal");
  }).then(function () {
    render();
    if (S.modal && S.modal.tipo === "persona") refrescarModal();

function entrar(clave) {
  S.loginError = null; S.ocupado = true; render();

    S.token = tok; lsSet(LS_TOKEN, tok); S.ocupado = false;
    return cargar();
  }).catch(function (e) {

function fechasValidas(p) {
  var l = [];
  (p.asistencias || []).forEach(function (a) { var c = claseDe(a.c); if (c && a.v) l.push(c.fecha); });
  return l.sort();
}
function pasoAvance(v) {
  var m = meta();
  if (v >= m) return "botella";
  if (v === m - 1) return "falta1";
  if (v === m - 2) return "faltan2";
  if (v === 1) return "clase1";
  if (v === 2) return "clase2";
  return null;
}
/* Los pasos que aplican hoy, cada uno con la fecha en que le tocó. Se manda solo el más reciente:
   si se pasó uno sin mandar y ya le tocó otro, el viejo ya no se propone. */
function candidatos(p) {
  var c = [], h = hoy(), m = meta(), v = p.validas || 0;
  if (p.excluido || p.estado === "excluido" || p.estado === "sin_seguimiento") return c;
  var fv = fechasValidas(p);
  // ganó la botella: se felicita dentro de los 10 días siguientes
  if (p.estado === "logro") {
    var fl = p.logro_fecha || fv[m - 1];
    if (fl && diasEntre(fl, h) <= 10) c.push({ k: ganoEY(p) ? "botella_ey" : "botella", f: fl });
  }
  if (p.estado === "en_curso") {
    var ka = v >= 1 ? pasoAvance(v) : null;
    if (ka) c.push({ k: ka, f: fv[v - 1] });
    var d = diasEntre(p.inicio, h), r = diasEntre(h, p.vence), u = fv[fv.length - 1];
    var quieto = !u || diasEntre(u, h) >= 7;       // "si no viene": ninguna clase en la última semana
    if (!v && d < 7) c.push({ k: "bienvenida", f: p.inicio });
    if (!v && d >= 7 && r > 15) c.push({ k: "semana1", f: sumarDias(p.inicio, 7) });
    if (quieto && r <= 15 && r > 7) c.push({ k: "quedan15", f: sumarDias(p.vence, -15) });
    if (quieto && r <= 7 && r >= 0) c.push({ k: "quedan7", f: sumarDias(p.vence, -7) });
  }
  if (p.estado === "vencio" && diasEntre(p.vence, h) <= 10) c.push({ k: "cierre", f: sumarDias(p.vence, 1) });
  return c.filter(function (x) { return x.f && plantilla(x.k).activo; });
}
function yaMandado(p, k) { return (p.mensajes || []).some(function (x) { return x.paso === k; }); }
function pasoQueToca(p) {
  var c = candidatos(p);
  if (!c.length) return null;
  c.sort(function (a, b) { return a.f < b.f ? -1 : a.f > b.f ? 1 : PASO[a.k].i - PASO[b.k].i; });
  var u = c[c.length - 1];
  return yaMandado(p, u.k) ? null : u;
}
function porEscribir() {
  var l = [];
  S.d.inscritos.forEach(function (p) { var x = pasoQueToca(p); if (x) l.push({ p: p, x: x }); });
  return l;
}
/* qué le tocará si no viene, para mostrarlo en la ficha */
function proximoAviso(p) {
  if (p.estado !== "en_curso") return null;
  var h = hoy(), l = [];
  if (!p.validas) l.push({ k: "semana1", f: sumarDias(p.inicio, 7) });
  l.push({ k: "quedan15", f: sumarDias(p.vence, -15) }, { k: "quedan7", f: sumarDias(p.vence, -7) }, { k: "cierre", f: sumarDias(p.vence, 1) });
  return l.filter(function (x) { return x.f > h && plantilla(x.k).activo && !yaMandado(p, x.k); })[0] || null;
}

function celularWA(p) {
  var cel = String(p.celular || "").replace(/\D/g, "");
  if (cel.length === 11 && cel.indexOf("51") === 0) cel = cel.slice(2);
  return /^9\d{8}$/.test(cel) ? cel : null;
}
function linkWA(p, texto) {
  var cel = celularWA(p);
  if (!cel) return null;
  return "https://wa.me/51" + cel + (texto ? "?text=" + encodeURIComponent(texto) : "");
}
/* Ícono de WhatsApp de las listas: si le toca un mensaje, se abre con el mensaje listo y queda anotado. */
function botonWA(p, etiqueta, k) {
  var x = k ? { k: k } : pasoQueToca(p);
  var u = linkWA(p, x ? textoPaso(x.k, p) : "");
  if (!u) return "";
  return '<a class="wa' + (x && !k ? " pend" : "") + '" href="' + esc(u) + '" target="_blank" rel="noopener"' +
    (x ? ' data-envio="' + x.k + '" data-id="' + p.id + '"' : "") +
    ' aria-label="' + esc(etiqueta || ((x ? "Mandar mensaje a " : "Escribir a ") + pila(p.nombre))) + '">' + ICON_MSG + "</a>";
}
function botonEnviar(p, k, chico) {
  var u = linkWA(p, textoPaso(k, p));
  if (!u) return "";
  return '<a class="btn ok' + (chico ? " sm" : "") + '" href="' + esc(u) + '" target="_blank" rel="noopener" data-envio="' + k + '" data-id="' + p.id + '">' +
    ICON_MSG + "WhatsApp</a>";
}
function modoTxt(m) { return m === "omitido" ? "omitido" : m === "aviso" ? "en persona" : "WhatsApp"; }

function listaInscritos() {

  var por = [], desc = [], conEY = [], entregadas = [];
  S.d.inscritos.forEach(function (p) {
    var b = estadoBotella(p);
    if (b === "por_entregar") por.push(p);
    else if (b === "con_ey") conEY.push(p);
    else if (b === "entregada") { entregadas.push(p); if (descuento(p) === "pendiente") desc.push(p); }
  });
  por.sort(function (a, b) { return String(a.logro_fecha).localeCompare(String(b.logro_fecha)); });
  entregadas.sort(function (a, b) { return b.botella_entregada_en.localeCompare(a.botella_entregada_en); });
  var html = '<p class="regla">La botella es el adelanto del Empiece Ya: si después gana el Empiece Ya, ese premio se le entrega sin botella.</p>';
  html += seccion("Por entregar", por.length, por.length ? por.map(filaPorEntregar).join("") : '<p class="hint">No hay botellas pendientes.</p>');
  if (desc.length) html += seccion("Descontar en su Empiece Ya", desc.length,
    '<p class="hint">Ya recibieron su botella y ganaron el Empiece Ya: su premio va sin botella.</p>' + desc.map(filaDescontar).join(""));
  if (conEY.length) html += seccion("Su botella viene con el Empiece Ya", conEY.length,
    '<p class="hint">Ganaron el Empiece Ya antes de recibir su botella: no se entrega aparte.</p>' + conEY.map(filaConEY).join(""));
  html += seccion("Entregadas", entregadas.length, entregadas.length ? entregadas.map(filaEntregada).join("") : '<p class="hint">Todavía no se entregó ninguna.</p>');

/* ----- números */
function vistaNumeros() {
  var m = meta(), base = S.d.inscritos.filter(function (p) { return !p.excluido; });
  var seg = base.filter(function (p) { return p.estado !== "sin_seguimiento"; });
  var n = seg.length, c = { uno: 0, tres: 0, logro: 0, vencio: 0, curso: 0, ey: 0 }, dias = [];
  seg.forEach(function (p) {
    if (p.validas >= 1) c.uno++;
    if (p.validas >= Math.min(3, m)) c.tres++;
    if (p.estado === "logro") { c.logro++; if (p.logro_fecha) dias.push(diasEntre(p.inicio, p.logro_fecha)); }
    else if (p.estado === "vencio") c.vencio++;
    else if (p.estado === "en_curso") c.curso++;
    if (ganoEY(p)) c.ey++;
  });
  var entregadas = 0, porEnt = 0;
  S.d.inscritos.forEach(function (p) { if (p.botella_entregada_en) entregadas++; else if (estadoBotella(p) === "por_entregar") porEnt++; });
  var cerrados = c.logro + c.vencio, eyH = S.d.ey_hasta;
  var html = "";
  if (!S.d.primera_clase) html += '<p class="aviso">Todavía no hay clases registradas. Los números empiezan a contar desde la primera clase que tomes.</p>';
  html += '<div class="kpis">' +
    kpi("Inscritos con seguimiento", n, S.d.primera_clase ? "desde el " + fCorta(S.d.primera_clase) : "aún sin clases") +
    kpi("Fueron a 1 clase o más", c.uno, n ? pct(c.uno, n) + "% de los inscritos" : "—") +
    kpi("Lograron el Nivel Cero", c.logro, cerrados ? pct(c.logro, cerrados) + "% de quienes cerraron su plazo" : "nadie cerró su plazo aún") +
    kpi("Con el plazo abierto", c.curso, c.curso ? "pueden lograrlo todavía" : "—") +
    kpi("Botellas entregadas", entregadas, porEnt ? porEnt + " por entregar" : "ninguna pendiente") +
    kpi("Ganaron Empiece Ya", c.ey, eyH ? "cargado hasta el PB" + eyH.pb + " (" + fCorta(eyH.fecha) + ")" : "sin resultados cargados") +
    "</div>";
  var pasos = [["Inscritos", n], ["Fueron a 1 clase o más", c.uno], ["Llegaron a " + Math.min(3, m) + " clases", c.tres], ["Lograron las " + m, c.logro], ["Ganaron Empiece Ya", c.ey]];
  html += '<section class="card pad bloque"><h2 class="sec-t" style="margin-top:0">Embudo</h2>' + pasos.map(function (s, i) {
    var w = n ? Math.max(s[1] ? 2 : 0, pct(s[1], n)) : 0;
    return '<div class="barra"><div class="barra-t"><span>' + esc(s[0]) + "</span><b>" + s[1] + (n && i ? " <small>" + pct(s[1], n) + "%</small>" : "") + "</b></div>" +
      '<div class="barra-f"><i style="width:' + w + '%"></i></div></div>';
  }).join("") + (dias.length ? '<p class="hint">Quienes lo logran tardan en promedio ' + plural(Math.round(dias.reduce(function (a, b) { return a + b; }, 0) / dias.length), "día", "días") + ".</p>" : "") + "</section>";
  html += bloqueComparacion(seg, eyH);
  html += bloqueMeses(base);
  html += bloqueHorarios();
  html += bloqueAfiliadores(seg);
  var sinSeg = base.length - seg.length;
  if (sinSeg) html += '<p class="hint">' + plural(sinSeg, "inscrito", "inscritos") + " de antes del " + (S.d.primera_clase ? fCorta(S.d.primera_clase) : "seguimiento") +
    (sinSeg === 1 ? " no tiene asistencias registradas y no entra" : " no tienen asistencias registradas y no entran") +
    " en los porcentajes. Si tienes sus asistencias en papel, crea esas clases con su fecha y márcalas.</p>";
  html += '<p class="mt"><a class="lk" href="https://empiece-ya.nelson1614.workers.dev" target="_blank" rel="noopener">Ver los ganadores del Empiece Ya en su portal ↗</a></p>';
  return html;
}
function kpi(t, v, s) {
  return '<div class="kpi card"><span class="lbl">' + esc(t) + "</span><b>" + v + '</b><span class="hint">' + esc(s) + "</span></div>";
}
function bloqueComparacion(seg, eyH) {
  var h = '<section class="card pad bloque"><h2 class="sec-t" style="margin-top:0">¿El Nivel Cero empuja el Empiece Ya?</h2>';
  if (!eyH) return h + '<p class="hint">Aún no hay resultados del Empiece Ya cargados.</p></section>';
  var ev = seg.filter(function (p) { return (p.estado === "logro" || p.estado === "vencio") && (p.ey_estado === "gano" || p.ey_estado === "no_gano"); });
  var nota = "Cuenta solo a quienes ya cerraron su plazo del Empiece Ya (su período de ingreso y dos más) y tienen esos resultados oficiales cargados, hoy hasta el PB" + eyH.pb + ".";
  if (!ev.length) return h + '<p class="hint">Todavía no hay a quién medir. ' + esc(nota) + "</p></section>";
  var con = ev.filter(function (p) { return p.estado === "logro"; }), sin = ev.filter(function (p) { return p.estado !== "logro"; });
  var a = con.filter(ganoEY).length, b = sin.filter(ganoEY).length;
  h += '<div class="comp"><div><span class="lbl">Con Nivel Cero</span><b>' + (con.length ? pct(a, con.length) + "%" : "—") + '</b><span class="hint">' + a + " de " + con.length + " ganaron su Empiece Ya</span></div>" +
    '<div><span class="lbl">Sin Nivel Cero</span><b>' + (sin.length ? pct(b, sin.length) + "%" : "—") + '</b><span class="hint">' + b + " de " + sin.length + " ganaron su Empiece Ya</span></div></div>";
  return h + '<p class="hint">' + esc(nota) + "</p></section>";
}
function bloqueMeses(base) {
  var g = {};
  base.forEach(function (p) {
    var k = p.fecha_inscripcion.slice(0, 7), r = g[k] || (g[k] = { ins: 0, sin: 0, fue: 0, logro: 0, curso: 0, ey: 0 });
    r.ins++;
    if (p.estado === "sin_seguimiento") r.sin++;
    if (p.validas >= 1) r.fue++;
    if (p.estado === "logro") r.logro++;
    if (p.estado === "en_curso") r.curso++;
    if (ganoEY(p)) r.ey++;
  });
  var ks = Object.keys(g).sort().reverse();
  if (!ks.length) return "";
  return '<section class="card pad bloque"><h2 class="sec-t" style="margin-top:0">Por mes de inscripción</h2><div class="tabla-x"><table class="t">' +
    "<thead><tr><th>Mes</th><th>Inscritos</th><th>Fueron</th><th>Lograron</th><th>Emp. Ya</th></tr></thead><tbody>" +
    ks.map(function (k) {
      var r = g[k], notas = [];
      if (r.curso) notas.push(r.curso + " en curso");
      if (r.sin) notas.push(r.sin + " sin seguimiento");
      return "<tr><td>" + esc(fMes(k)) + (notas.length ? '<div class="hint">' + esc(notas.join(" · ")) + "</div>" : "") + "</td><td>" + r.ins + "</td><td>" + r.fue +
        "</td><td><b>" + r.logro + "</b></td><td>" + r.ey + "</td></tr>";
    }).join("") + "</tbody></table></div></section>";
}
function bloqueHorarios() {
  var g = {}, h = hoy();
  S.d.clases.forEach(function (c) {
    if (c.fecha > h) return;
    var d = dow(c.fecha), k = d + "|" + c.hora, r = g[k] || (g[k] = { dia: d, hora: c.hora, clases: 0, total: 0 });
    r.clases++; r.total += c.n;
  });
  var l = Object.keys(g).map(function (k) { return g[k]; }).sort(function (a, b) { return b.total / b.clases - a.total / a.clases; });
  if (!l.length) return "";
  return '<section class="card pad bloque"><h2 class="sec-t" style="margin-top:0">Asistencia por horario</h2><table class="t"><thead><tr><th>Horario</th><th>Clases</th><th>Promedio</th></tr></thead><tbody>' +
    l.map(function (r) {
      return "<tr><td>" + esc(mayus(DIAS[r.dia]) + " " + hora12(r.hora)) + "</td><td>" + r.clases + "</td><td><b>" + (Math.round(r.total * 10 / r.clases) / 10) + "</b></td></tr>";
    }).join("") + '</tbody></table><p class="hint">Promedio de nuevos que asisten por clase.</p></section>';
}
function bloqueAfiliadores(seg) {
  var g = {};
  seg.forEach(function (p) {
    var k = p.afiliador ? titulo(p.afiliador) : "Sin dato", r = g[k] || (g[k] = { n: 0, fue: 0, logro: 0 });
    r.n++; if (p.validas >= 1) r.fue++; if (p.estado === "logro") r.logro++;
  });
  var l = Object.keys(g).map(function (k) { return [k, g[k]]; }).sort(function (a, b) { return b[1].n - a[1].n || b[1].logro - a[1].logro; }).slice(0, 10);
  if (!l.length) return "";
  return '<section class="card pad bloque"><h2 class="sec-t" style="margin-top:0">Por quién los afilió</h2><table class="t"><thead><tr><th>Afiliador</th><th>Inscritos</th><th>Fueron</th><th>Lograron</th></tr></thead><tbody>' +
    l.map(function (x) { return "<tr><td>" + esc(x[0]) + "</td><td>" + x[1].n + "</td><td>" + x[1].fue + "</td><td><b>" + x[1].logro + "</b></td></tr>"; }).join("") +
    "</tbody></table></section>";
}

/* ----- Empiece Ya de WV08 */
function vistaEY() {
  var lista = S.d.ey_wv08 || [], anios = {};
  lista.forEach(function (w) { var y = String(w.fecha).slice(0, 4); anios[y] = (anios[y] || 0) + 1; });
  var ys = Object.keys(anios).sort().reverse();
  if (!S.eyAnio || (S.eyAnio !== "todos" && !anios[S.eyAnio])) S.eyAnio = ys[0] || "todos";
  var sel = lista.filter(function (w) { return S.eyAnio === "todos" || String(w.fecha).slice(0, 4) === S.eyAnio; });
  var cn = { 1: 0, 2: 0, 3: 0, 4: 0 }, sinDetalle = 0;
  sel.forEach(function (w) {
    var l = (w.niveles || []).map(function (x) { return x.n; });
    if (!l.length) sinDetalle++;
    l.forEach(function (n) { cn[n]++; });
  });
  var vis = S.eyNivel ? sel.filter(function (w) { return (w.niveles || []).some(function (x) { return x.n === S.eyNivel; }); }) : sel;
  var eyH = S.d.ey_hasta;
  var html = '<p class="regla">Ganadores del Empiece Ya de tu equipo WV08' + (eyH ? ", cargados hasta el PB" + eyH.pb + " (" + esc(fCorta(eyH.fecha)) + ")" + (eyH.estado === "Preliminar" ? " preliminar" : "") : "") + ".</p>";
  html += '<div class="chips">' + ys.map(function (y) {
    return '<button class="chip' + (S.eyAnio === y ? " on" : "") + '" data-a="eyAnio" data-y="' + y + '">' + y + "<span>" + anios[y] + "</span></button>";
  }).join("") + '<button class="chip' + (S.eyAnio === "todos" ? " on" : "") + '" data-a="eyAnio" data-y="todos">Todos<span>' + lista.length + "</span></button></div>";
  html += '<div class="niveles">' + tileNivel(0, "Ganadores", sel.length) + tileNivel(1, "Nivel I", cn[1]) + tileNivel(2, "Nivel II", cn[2]) +
    tileNivel(3, "Nivel III", cn[3]) + tileNivel(4, "Miami", cn[4]) + "</div>";
  if (sinDetalle) html += '<p class="hint">' + plural(sinDetalle, "ganador no tiene", "ganadores no tienen") + " el detalle del premio (se carga desde el PB10 de 2026), así que su nivel no se conoce.</p>";
  var c = { con: 0, sin: 0, fuera: 0 };
  vis.forEach(function (w) { c[cruceN0(w).grupo]++; });
  if (S.eyCruce) vis = vis.filter(function (w) { return cruceN0(w).grupo === S.eyCruce; });
  html += '<section class="card pad"><span class="lbl">Contra el Nivel Cero' + (S.eyNivel ? " · " + (S.eyNivel === 4 ? "Miami" : "Nivel " + ROMANO[S.eyNivel]) : "") + "</span>" +
    '<div class="cruce">' + celdaCruce("con", "ok", c.con, "hicieron el Nivel Cero") + celdaCruce("sin", "mal", c.sin, "ganaron sin completar las " + meta() + " clases") +
    celdaCruce("fuera", "", c.fuera, "de antes o fuera del registro") + '</div><p class="hint" style="margin:10px 0 0">Toca un número para ver solo esos.</p></section>';
  var grupos = {}, orden = [];
  vis.forEach(function (w) { if (!grupos[w.fecha]) { grupos[w.fecha] = []; orden.push(w.fecha); } grupos[w.fecha].push(w); });
  orden.sort().reverse();
  if (!vis.length) html += '<p class="hint mt">No hay ganadores con ese filtro.</p>';
  orden.forEach(function (k) {
    var g = grupos[k], w0 = g[0];
    html += '<h2 class="sec-t">' + esc((w0.pb ? etPB({ pb: w0.pb, anio: w0.anio }) + " · " : "") + fCorta(k)) + ' <span class="cuenta">' + g.length + "</span></h2>" + g.map(filaGanador).join("");
  });
  html += bloquePlazoEY();
  return html;
}
function celdaCruce(g, cls, n, t) {

}

function bloquePlazoEY() {
  var c = { gano: 0, en_plazo: 0, esperando: 0, preliminar: 0, no_gano: 0 }, pend = {};
  S.d.inscritos.forEach(function (p) {
    if (p.excluido || !c.hasOwnProperty(p.ey_estado)) return;
    c[p.ey_estado]++;
    if ((p.ey_estado === "esperando" || p.ey_estado === "preliminar") && p.ey_fin) pend[p.ey_fin.cierre] = p.ey_fin;
  });
  var pl = Object.keys(pend).sort().map(function (k) { return pend[k]; });
  var h = '<section class="card pad bloque"><h2 class="sec-t" style="margin-top:0">Tus inscritos y su Empiece Ya</h2>' +
    '<p class="hint" style="margin-top:0">Rena Ware da el período en que se inscribió y dos más. Si no aparece entre los ganadores de esos tres, ya no ganó.</p>' +
    '<div class="cruce c4"><div class="ok"><b>' + c.gano + "</b><span>ganaron</span></div><div><b>" + c.en_plazo + "</b><span>en plazo</span></div>" +
    "<div><b>" + (c.esperando + c.preliminar) + "</b><span>esperando resultados</span></div><div><b>" + c.no_gano + "</b><span>no ganaron</span></div></div>";
  if (pl.length) h += '<p class="aviso chico">Faltan los resultados oficiales del ' + esc(pl.length === 1 ? etPB(pl[0]) : etPB(pl[0]) + " al " + etPB(pl[pl.length - 1])) +
    ". Al cargarlos, esta cuenta se actualiza sola.</p>";
  return h + "</section>";
}

/* Anotar el envío. Va con keepalive para que llegue aunque se abra WhatsApp; si el navegador no lo acepta

var LS_ENVIOS = "n0-envios";
function enviosPend() { try { return JSON.parse(lsGet(LS_ENVIOS) || "[]") || []; } catch (e) { return []; } }
function guardarEnviosPend(l) { lsSet(LS_ENVIOS, l.length ? JSON.stringify(l) : null); }
function anotarEnvio(x) {
  var args = { p_token: S.token, p_inscrito: x.pid, p_paso: x.k, p_modo: x.modo, p_texto: x.texto };
  return rpc("n0_mensaje_registrar", args, true).catch(function (e) {
    if (e instanceof TypeError) return rpc("n0_mensaje_registrar", args);
    throw e;
  });
}
function ponerEnviosPend() {
  enviosPend().forEach(function (x) {
    var p = IDX.ins[x.pid];
    if (p && !yaMandado(p, x.k)) p.mensajes = (p.mensajes || []).concat([{ id: x.t, paso: x.k, modo: x.modo, en: x.en || hoy(), tmp: true }]);
  });
}
function reintentarEnvios() {
  var l = enviosPend();
  if (!l.length || !S.token || !S.d) return;
  guardarEnviosPend([]);
  l.forEach(function (x) {
    anotarEnvio(x).then(function (fila) { parchar(fila); render(); }).catch(function (e) {
      if (e instanceof TypeError) guardarEnviosPend(enviosPend().concat([x]));
      else if (S.token) aviso("No se anotó un mensaje: " + bonito(e.message), "mal");
    });
  });

/* Anota el envío. El enlace de WhatsApp se abre igual; la lista se repinta un instante después. */
function registrarEnvio(pid, k, modo) {
  var p = IDX.ins[pid];
  if (!p || !PASO[k]) return;
  var texto = modo === "omitido" ? null : textoPaso(k, p);
  var tmp = { id: "tmp" + Date.now(), paso: k, modo: modo, en: hoy(), tmp: true };
  var x = { pid: pid, k: k, modo: modo, texto: texto, t: tmp.id, en: tmp.en };
  p.mensajes = (p.mensajes || []).concat([tmp]);
  anotarEnvio(x).then(function (fila) {
    parchar(fila); repintarMensajes(pid);
  }).catch(function (e) {
    if (e instanceof TypeError) {                       // sin conexión: queda guardado y se manda luego
      guardarEnviosPend(enviosPend().concat([x]));
      aviso("Sin conexión: se anotará cuando vuelva la señal", "mal");
      return;
    }
    var q = IDX.ins[pid];
    if (q) q.mensajes = (q.mensajes || []).filter(function (m) { return m !== tmp; });
    repintarMensajes(pid);
    if (S.token) aviso("No se anotó el mensaje: " + bonito(e.message), "mal");
  });
  setTimeout(function () { repintarMensajes(pid); }, 400);
  aviso(modo === "omitido" ? "Omitido: " + nombrePaso(k) : modo === "aviso" ? "Anotado: le avisaste en persona" : "Anotado como enviado", "ok");
}
function repintarMensajes(pid) {

function aviso(msg, tipo) {

function marcar(id) {
  var c = claseDe(S.clase);
  if (!c || c.fecha > hoy()) return;
  var clave = c.id + ":" + id;
  if (enVuelo[clave]) return;
  enVuelo[clave] = true;
  var pres = IDX.presentes[c.id] || (IDX.presentes[c.id] = {});
  var nuevo = !pres[id], antes = IDX.ins[id] ? IDX.ins[id].validas : 0;
  if (nuevo) pres[id] = true; else delete pres[id];
  c.n += nuevo ? 1 : -1;
  pintarAsis(id);
  rpc("n0_marcar", { p_token: S.token, p_clase: c.id, p_inscrito: id, p_presente: nuevo }).then(function (r) {
    var k = claseDe(r.clase_id); if (k) k.n = r.n;
    parchar(r.inscrito);
    var p = r.inscrito;
    if (nuevo && p && antes < meta() && p.validas >= meta()) aviso("¡" + pila(p.nombre) + " completó sus " + meta() + " clases! Ganó su botella.", "ok");
  }).catch(function (e) {
    if (nuevo) delete pres[id]; else pres[id] = true;
    c.n += nuevo ? -1 : 1;
    if (S.token) aviso(bonito(e.message), "mal");
  }).then(function () {
    delete enVuelo[clave];
    if (S.token) pintarAsis(id);
  });
}
/* Al marcar solo se repinta esa fila, el contador y las pestañas: la lista no salta. */
function pintarAsis(id) {
  var c = claseDe(S.clase), p = IDX.ins[id];
  if (!c || !p) return;
  var btn = document.querySelector('.fila.asis[data-id="' + id + '"]');
  if (btn) {
    var tmp = document.createElement("div");
    tmp.innerHTML = filaAsis(p, c, !!(IDX.presentes[c.id] || {})[id], enPlazo(p, c.fecha));
    btn.replaceWith(tmp.firstChild);
  }
  var cont = document.querySelector(".contador");
  if (cont) cont.innerHTML = "<b>" + c.n + '</b><span class="caps tiny">' + (c.n === 1 ? "asistió" : "asistieron") + "</span>";
  var cab = document.querySelector("header.top");
  if (cab) {
    var t2 = document.createElement("div");
    t2.innerHTML = vistaCabecera();
    cab.replaceWith(t2.firstChild);
  }
}

/* Marca la clase en la ficha. Si se escribió un tema y esa clase no tenía, se lo pone. */
function agregarAsistencia(claseId, recargarTodo) {
  var md = S.modal, pid = md && md.id;
  if (!pid || S.ocupado) return Promise.resolve();
  var fIn = val("eFechaClase"); if (fIn) md.fechaClase = fIn;
  var tema = (val("eTemaClase") || md.temaClase || "").trim(), c0 = claseDe(claseId);
  S.ocupado = true;
  var antes = IDX.ins[pid] ? IDX.ins[pid].validas : 0;
  var paso = tema && c0 && !c0.tema
    ? rpc("n0_clase_guardar", { p_token: S.token, p_id: c0.id, p_fecha: c0.fecha, p_hora: c0.hora, p_tema: tema, p_tipo: c0.tipo }).then(function (k) { ponerClase(k); })
    : Promise.resolve();
  return paso.then(function () {
    return rpc("n0_marcar", { p_token: S.token, p_clase: claseId, p_inscrito: pid, p_presente: true });
  }).then(function (r) {
    S.ocupado = false;
    var k = claseDe(r.clase_id); if (k) k.n = r.n;
    parchar(r.inscrito);
    if (S.modal && S.modal.id === pid) { S.modal.opciones = null; S.modal.temaClase = ""; refrescarModal(); }
    render();
    var p = r.inscrito, c = claseDe(claseId);
    var a = p && (p.asistencias || []).filter(function (x) { return x.c === claseId; })[0];
    aviso(p && antes < meta() && p.validas >= meta() ? "¡" + pila(p.nombre) + " completó sus " + meta() + " clases! Ganó su botella."
      : a && !a.v ? "Clase agregada, pero fue fuera de su plazo: no suma"
      : "Clase agregada" + (c ? ": " + fDia(c.fecha) : ""), a && !a.v ? "mal" : "ok");
    if (recargarTodo) cargar(true);
  }).catch(function (e) { S.ocupado = false; if (S.token) aviso(bonito(e.message), "mal"); });
}
function quitarAsistencia(claseId) {
  var pid = S.modal && S.modal.id;
  if (!pid || S.ocupado) return;
  S.ocupado = true;

  }).catch(function (e) { S.ocupado = false; if (S.token) aviso(bonito(e.message), "mal"); });
}

  } else if (e.target.id === "mTexto" && S.modal && S.modal.tipo === "mensajes" && S.modal.borrador) {
    S.modal.borrador[S.modal.ver] = e.target.value;
    S.modal.cursor = e.target.selectionStart;
    var pv = document.getElementById("mPrev");
    if (pv) pv.textContent = llenar(e.target.value, muestraPersona(), S.modal.ver);
  }
});
document.addEventListener("focusout", function (e) {
  if (e.target.id === "mTexto" && S.modal && S.modal.tipo === "mensajes") S.modal.cursor = e.target.selectionStart;
});
document.addEventListener("change", function (e) {
  var k = e.target.getAttribute && e.target.getAttribute("data-in");
  if (k === "fuera") {
    S.fuera = e.target.checked;
    var c = claseDe(S.clase), box = document.getElementById("lista-asis");
    if (c && box) box.innerHTML = listaAsistencia(c);
  }
  // al cambiar la fecha de una clase nueva se propone la hora de ese día; el campo de fecha no se toca
  if (e.target.id === "fFecha" && S.modal && S.modal.tipo === "clase") {
    leerForm();
    if (!S.modal.horaElegida && S.modal.fecha) {
      var hh = horarioDe(S.modal.fecha)[0];
      S.modal.hora = hh ? hh.hora : null;
      S.modal.otra = false;
    }
    actualizarChipsHora();
  }
});
document.addEventListener("submit", function (e) {
  if (e.target.id === "fLogin") {
    e.preventDefault();
    var v = val("clave");
    if (v && !S.ocupado) entrar(v);
  }
});
var ocultoDesde = 0;
window.addEventListener("online", function () { reintentarEnvios(); });
document.addEventListener("visibilitychange", function () {
  if (document.hidden) { ocultoDesde = Date.now(); return; }
  reintentarEnvios();
  if (S.token && S.d && !S.modal && ocultoDesde && Date.now() - ocultoDesde > 60000) cargar(true);
});

render();
if (S.token) cargar();
})();
</script>
</body>
</html>
